services:
  ege-bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    stop_grace_period: 50s
volumes:
  bot-data:
